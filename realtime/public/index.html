<!doctype html>
<html>
  <head>
    <title>Realtime Practice</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 500px;
        margin: 40px auto;
      }
      #messages {
        border: 1px solid #ccc;
        height: 300px;
        overflow-y: auto;
        padding: 10px;
      }
      #messages div {
        padding: 4px;
        border-bottom: 1px solid #eee;
      }
      input {
        width: 78%;
        padding: 8px;
      }
      button {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h2>🔌 Realtime Chat (practice)</h2>
    <div id="messages"></div>
    <br />
    <input id="input" placeholder="type a message..." autocomplete="off" />
    <button onclick="send()">Send</button>

    <!-- Socket.IO client library (served automatically by the socket.io server) -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io(); // opens the WebSocket connection to the server

      // when the server sends a "message", show it
      socket.on('message', (text) => {
        const div = document.createElement('div');
        div.textContent = text;
        document.getElementById('messages').appendChild(div);
      });

      function send() {
        const input = document.getElementById('input');
        if (input.value) {
          socket.emit('message', input.value); // send to the server
          input.value = '';
        }
      }
      // send on Enter key too
      document.getElementById('input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });
    </script>
  </body>
</html>
